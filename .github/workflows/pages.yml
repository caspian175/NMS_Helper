# Publica la versión web en GitHub Pages en cada push a main.
#
# El sitio no descarga nada: se arma con la copia versionada del repositorio
# (data/db.json + data/glyphs/), así que un fallo de las fuentes comunitarias
# no puede romper la publicación. Antes de montarlo se comprueba que la API
# estática del navegador (web/static-db.js) cuadra con nms_helper/db.py.
name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar que la web estática cuadra con Python
        run: python tools/static_parity.py --require-node

      - name: Montar el sitio
        run: python tools/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
